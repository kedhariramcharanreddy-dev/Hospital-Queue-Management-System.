<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Queue Management System: Patient Login</title>
    <link rel="stylesheet" href="patlogin.css">
</head>
<body data-login-role="patient">
    <main>
        <section class="loginpage">
            <div id="content">
                <a id="logo">Hospital Queue Management System</a>
                <h1>Welcome Back!</h1>
            </div>
            <div id="form">
                <form>
                    <h4>Patient Login</h4>
                    <p>Sign in to your account</p>
                    <label for="email" class="l1">Email Address</label><br>
                    <input class="box" id="email" name="email" type="email" placeholder="Enter your registered email" required><br><br>
                    <label for="password" class="l1">Password</label><br>
                    <input type="password" id="password" class="box" placeholder="Enter Password" required><br><br>
                    <input type="checkbox" class="i1" id="remember">
                    <label for="remember"class="l2">Remember me</label>
                    <a href="" id="pass">Forgot Password?</a><br><br>

                    <input type="submit" class="login" value="Login">
                </form>
            </div>
        </section>
    </main>
<script src="auth.js"></script></body>
</html>
